name: Field Investigator theme patch

on:
  push:
    paths:
      - '.github/workflows/field-investigator-theme-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dark diagnostic theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('troubleshooters/gremlin-field-investigator.user.js')
          s = p.read_text()
          old = ":host{font:13px system-ui;color:#182230}button{font:inherit;cursor:pointer}.launch{border:0;border-radius:999px;padding:9px 12px;box-shadow:0 4px 16px #0004}.panel{width:460px;max-width:90vw;max-height:74vh;overflow:auto;background:#fff;border:2px solid #5b4b8a;border-radius:12px;padding:12px;box-shadow:0 10px 30px #0005}.row{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.row button{padding:7px 9px}.status{font-size:12px;margin:6px 0}pre{white-space:pre-wrap;word-break:break-word;background:#f4f4f7;padding:8px;border-radius:6px;max-height:44vh;overflow:auto}small{display:block;line-height:1.35}.hide{float:right}"
          new = ":host{font:13px system-ui;color:#e6edf3}button{font:inherit;cursor:pointer;color:#e6edf3;background:#17212b;border:1px solid #2dd4bf;border-radius:8px}.launch{border:1px solid #2dd4bf;border-radius:999px;padding:9px 12px;background:#111827;color:#d1fae5;box-shadow:0 4px 16px #0007}.panel{width:460px;max-width:90vw;max-height:74vh;overflow:auto;background:#0f1720;border:2px solid #2dd4bf;border-radius:12px;padding:12px;box-shadow:0 10px 30px #0008}.row{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.row button{padding:7px 9px}.row button:hover{background:#1f2937}.status{font-size:12px;margin:6px 0;color:#99f6e4}pre{white-space:pre-wrap;word-break:break-word;background:#09111a;color:#cbd5e1;border:1px solid #334155;padding:8px;border-radius:6px;max-height:44vh;overflow:auto}small{display:block;line-height:1.35;color:#94a3b8}.hide{float:right}"
          if old not in s:
              raise SystemExit('theme CSS block not found')
          s = s.replace(old, new, 1)
          s = s.replace('// @version      0.2.1', '// @version      0.2.2', 1)
          s = s.replace("investigatorVersion:'0.2.1'", "investigatorVersion:'0.2.2'")
          s = s.replace('Gremlin Field Investigator 0.2.1', 'Gremlin Field Investigator 0.2.2')
          p.write_text(s)
          PY
      - name: Commit theme
        run: |
          git config user.name "gremlinlogic-bot"
          git config user.email "34165603+bljscrivener@users.noreply.github.com"
          git add troubleshooters/gremlin-field-investigator.user.js
          git commit -m "Retheme Field Investigator diagnostic UI"
          git push
