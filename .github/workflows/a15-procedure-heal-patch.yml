name: A15 procedure self-heal patch

on:
  push:
    paths:
      - '.github/workflows/a15-procedure-heal-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Widen procedure self-heal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('imagetrend-a15-native-test.user.js')
          s=p.read_text()
          s=s.replace('0.2.4.16','0.2.4.17')
          s=s.replace("function procedureName(entry){","function procedureName(entry,{quiet=false}={}){")
          s=s.replace("if(!candidates.length)throw Error('Procedure code has no loaded display mapping. Open its entry and preview again.');","if(!candidates.length){if(quiet)return null;throw Error('Procedure code has no loaded display mapping. Open its entry and preview again.');}")
          s=s.replace("if(candidates.length!==1)throw Error('Procedure code has conflicting display mappings.');","if(candidates.length!==1){if(quiet)return null;throw Error('Procedure code has conflicting display mappings.');}")
          old="return entries.map((entry,i)=>({...c,entry,label:c.label,entryLabel:(path.includes('.Vitals[]')?'Vital':'Procedure')+' '+(i+1)}));"
          new="return entries.flatMap((entry,i)=>{if(path.includes('.PatientProcedures[]')&&!procedureName(entry,{quiet:true}))return [];return [{...c,entry,label:c.label,entryLabel:(path.includes('.Vitals[]')?'Vital':'Procedure')+' '+(i+1)}];});"
          if old not in s: raise SystemExit('expandChoice target not found')
          s=s.replace(old,new,1)
          old="const names=entries.map(procedureName); // Unknown entries block creation, never assume missing.\n    const missing=procedureNames.filter(n=>!names.includes(n));\n    if(!missing.length)return null;"
          new="const classified=entries.map(entry=>({entry,name:procedureName(entry,{quiet:true})}));\n    const names=classified.map(x=>x.name).filter(Boolean);\n    const missing=procedureNames.filter(n=>!names.includes(n));\n    if(!missing.length)return null;\n    if(classified.some(x=>!x.name))throw Error('Unrecognized existing procedure preserved; A15 procedure creation deferred.');"
          if old not in s: raise SystemExit('creationPlan target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          r=Path('README.md')
          t=r.read_text().replace('Gremlin Logic 0.2.4.16','Gremlin Logic 0.2.4.17').replace('RELEASE-0.2.4.16.md','RELEASE-0.2.4.17.md')
          r.write_text(t)
          Path('RELEASE-0.2.4.17.md').write_text('# Gremlin Logic A15 0.2.4.17\n\nForeign or unresolved procedures are preserved and skipped during A15 field repair. Recognized A15 procedures continue through role, authorization, success, and timestamp reconciliation. Missing-procedure creation remains conservative when identity is unresolved.\n')
          PY
      - name: Commit patch
        run: |
          git config user.name "gremlinlogic-bot"
          git config user.email "34165603+bljscrivener@users.noreply.github.com"
          git add imagetrend-a15-native-test.user.js README.md RELEASE-0.2.4.17.md
          git commit -m "Widen A15 procedure self-heal around foreign entries"
          git push
