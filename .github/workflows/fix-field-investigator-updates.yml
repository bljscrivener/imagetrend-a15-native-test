name: Fix Field Investigator self-update metadata

on:
  push:
    paths:
      - '.github/workflows/fix-field-investigator-updates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add update metadata and bump investigator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('troubleshooters/gremlin-field-investigator.user.js')
          s = p.read_text()
          s = s.replace('// @version      0.2.0', '// @version      0.2.1', 1)
          s = s.replace("investigatorVersion:'0.2.0'", "investigatorVersion:'0.2.1'")
          s = s.replace('Gremlin Field Investigator 0.2.0', 'Gremlin Field Investigator 0.2.1')
          marker = '// @match        https://*.imagetrendelite.com/Elite/*\n'
          add = marker + '// @updateURL    https://raw.githubusercontent.com/bljscrivener/imagetrend-a15-native-test/main/troubleshooters/gremlin-field-investigator.user.js\n// @downloadURL  https://raw.githubusercontent.com/bljscrivener/imagetrend-a15-native-test/main/troubleshooters/gremlin-field-investigator.user.js\n'
          if '@updateURL' not in s:
              if marker not in s:
                  raise SystemExit('match marker not found')
              s = s.replace(marker, add, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "gremlinlogic-bot"
          git config user.email "34165603+bljscrivener@users.noreply.github.com"
          git add troubleshooters/gremlin-field-investigator.user.js
          git commit -m "Fix Field Investigator self-update metadata"
          git push
